<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>ホワサバ パズル管理 (Multi-Collapse)</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        :root {
            --primary: #3498db;
            --secondary: #1a1a1a;
            --accent: #e74c3c;
            --bg: #121212;
            --card-bg: #1e1e1e;
            --text: #e0e0e0;
            --border: #333333;
            --rarity-bg: #252525;
        }

        body { font-family: 'Helvetica Neue', Arial, sans-serif; background: var(--bg); margin: 0; padding: 10px; color: var(--text); }
        .container { max-width: 800px; margin: 0 auto; background: var(--card-bg); padding: 20px; border-radius: 16px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        
        .char-selector { 
            background: #252525; padding: 15px; border-radius: 10px; margin-bottom: 20px; 
            border: 1px solid var(--border); display: flex; flex-wrap: wrap; gap: 10px; align-items: center;
        }
        select { background: #333; color: #fff; border: 1px solid var(--border); padding: 8px; border-radius: 5px; flex-grow: 1; outline: none; }
        .char-btn { padding: 8px 12px; font-size: 0.8rem; cursor: pointer; border-radius: 5px; border: none; font-weight: bold; }

        h1 { font-size: 1.2rem; text-align: center; color: var(--primary); margin: 10px 0 20px; }

        /* 第1階層：カテゴリ */
        .category { margin-bottom: 12px; border: 1px solid var(--border); border-radius: 10px; overflow: hidden; }
        .category-title { background: var(--secondary); color: var(--primary); padding: 14px 20px; cursor: pointer; font-weight: bold; display: flex; justify-content: space-between; }
        .category-title::after { content: '▼'; font-size: 0.8rem; transition: 0.3s; color: var(--text); }
        .category.active .category-title::after { transform: rotate(180deg); }
        .category-content { display: none; padding: 15px; }
        .category.active .category-content { display: block; }

        /* 第2階層：パズル（セット） */
        .set-container { margin-bottom: 10px; border: 1px solid #333; border-radius: 8px; overflow: hidden; }
        .set-title { 
            font-weight: bold; color: var(--primary); padding: 10px; 
            background: #252525; cursor: pointer; display: flex; justify-content: space-between; align-items: center;
            font-size: 0.95rem; border-left: 4px solid var(--primary); 
        }
        .set-title:hover { background: #2c2c2c; }
        .set-title::after { content: '▼'; font-size: 0.7rem; transition: 0.3s; color: #666; }
        .set-container.active .set-title::after { transform: rotate(180deg); }
        .set-content { display: none; padding: 10px; background: #1e1e1e; }
        .set-container.active .set-content { display: block; }

        .rarity-group { margin-bottom: 10px; padding: 8px; background: var(--rarity-bg); border-radius: 6px; }
        .stars { color: #f1c40f; font-size: 0.75rem; margin-bottom: 5px; display: block; }
        
        .piece-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(60px, 1fr)); gap: 8px; }
        .piece-item { display: flex; flex-direction: column; align-items: center; padding: 6px; border: 1px solid var(--border); border-radius: 6px; cursor: pointer; background: #2c2c2c; transition: 0.2s; }
        .piece-item.owned { background: #1a3a5a; border-color: var(--primary); }
        .piece-item.extra { background: #4a1a1a; border-color: var(--accent); }
        .piece-num { font-size: 0.85rem; font-weight: bold; }
        .status-badge { font-size: 0.5rem; background: var(--accent); color: white; padding: 1px 3px; border-radius: 3px; margin-top: 3px; display: none; }
        .extra .status-badge { display: block; }

        .controls, .backup-area { background: var(--secondary); padding: 15px; border-radius: 12px; margin-top: 20px; border: 1px solid var(--border); }
        textarea { width: 100%; height: 80px; margin-top: 10px; background: #222; color: #fff; border: 1px solid var(--border); border-radius: 8px; padding: 10px; box-sizing: border-box; }
        button { width: 100%; padding: 12px; background: var(--primary); color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; margin-bottom: 5px; }
    </style>
</head>
<body>

<div class="container">
    <div class="char-selector">
        <select id="char-select" onchange="switchChar()"></select>
        <button class="char-btn" style="background: #27ae60; color: white;" onclick="addChar()">追加</button>
        <button class="char-btn" style="background: #c0392b; color: white;" onclick="deleteChar()">削除</button>
    </div>

    <h1>🧩 ホワサバ パズル管理</h1>
    <div id="puzzle-list"></div>

    <div class="controls">
        <button onclick="generateOutput()">共有用テキストを生成</button>
        <textarea id="output" readonly></textarea>
    </div>

    <div class="backup-area">
        <button style="background: #555; font-size: 0.8rem;" onclick="exportData()">全データ書き出し</button>
        <textarea id="backup-text" placeholder="バックアップデータをここに貼り付け"></textarea>
        <button style="background: #1e7e46; font-size: 0.8rem;" onclick="importData()">データを復元</button>
    </div>
</div>

<script>
let puzzleData = {};
let currentChar = "";
// 構造: { "キャラ名": { counts: {}, closedCats: {}, closedSets: {} } }
let allData = JSON.parse(localStorage.getItem('puzzle_v5_data')) || { "デフォルト": { counts: {}, closedCats: {}, closedSets: {} } };

async function loadData() {
    try {
        const response = await fetch('data.json');
        puzzleData = await response.json();
        const lastChar = localStorage.getItem('puzzle_last_char_v5');
        currentChar = (lastChar && allData[lastChar]) ? lastChar : Object.keys(allData)[0];
        updateCharList();
        init();
    } catch (e) { document.getElementById('puzzle-list').innerText = "data.jsonが見つかりません。"; }
}

function updateCharList() {
    const select = document.getElementById('char-select');
    select.innerHTML = "";
    Object.keys(allData).forEach(name => {
        const opt = document.createElement('option');
        opt.value = name;
        opt.innerText = name;
        if(name === currentChar) opt.selected = true;
        select.appendChild(opt);
    });
}

function addChar() {
    const name = prompt("キャラクター名を入力:");
    if (name && !allData[name]) {
        allData[name] = { counts: {}, closedCats: {}, closedSets: {} };
        ["復活の炎", "英雄の歌", "世界探究"].forEach(c => allData[name].closedCats[c] = true);
        currentChar = name;
        saveAll();
        updateCharList();
        init();
    }
}

function deleteChar() {
    if (Object.keys(allData).length <= 1) return;
    if (confirm(`「${currentChar}」を削除しますか？`)) {
        delete allData[currentChar];
        currentChar = Object.keys(allData)[0];
        saveAll();
        updateCharList();
        init();
    }
}

function switchChar() {
    currentChar = document.getElementById('char-select').value;
    localStorage.setItem('puzzle_last_char_v5', currentChar);
    init();
}

function init() {
    const listEl = document.getElementById('puzzle-list');
    listEl.innerHTML = "";
    const charData = allData[currentChar];
    const counts = charData.counts || {};
    const closedCats = charData.closedCats || {};
    const closedSets = charData.closedSets || {};

    for (const cat in puzzleData) {
        const catDiv = document.createElement('div');
        catDiv.className = 'category' + (closedCats[cat] ? '' : ' active');
        
        const catTitle = document.createElement('div');
        catTitle.className = 'category-title';
        catTitle.innerText = cat;
        catTitle.onclick = () => {
            const active = catDiv.classList.toggle('active');
            allData[currentChar].closedCats[cat] = !active;
            saveAll();
        };

        const catContent = document.createElement('div');
        catContent.className = 'category-content';

        for (const set in puzzleData[cat]) {
            const setDiv = document.createElement('div');
            const setKey = `${cat}_${set}`;
            setDiv.className = 'set-container' + (closedSets[setKey] ? '' : ' active');

            const setTitle = document.createElement('div');
            setTitle.className = 'set-title';
            setTitle.innerText = set;
            setTitle.onclick = () => {
                const active = setDiv.classList.toggle('active');
                allData[currentChar].closedSets[setKey] = !active;
                saveAll();
            };

            const setContent = document.createElement('div');
            setContent.className = 'set-content';

            for (const sub in puzzleData[cat][set]) {
                const rarDiv = document.createElement('div');
                rarDiv.className = 'rarity-group';
                const starStr = isNaN(sub.replace('S','')) ? sub : '⭐'.repeat(parseInt(sub.replace('S','')));
                rarDiv.innerHTML = `<span class="stars">${starStr}</span>`;
                const pieceList = document.createElement('div');
                pieceList.className = 'piece-list';

                puzzleData[cat][set][sub].forEach(num => {
                    const id = `${cat}_${set}_${sub}_${num}`;
                    const val = counts[id] || 0;
                    const item = document.createElement('div');
                    item.className = `piece-item ${val >= 1 ? 'owned' : ''} ${val === 2 ? 'extra' : ''}`;
                    item.onclick = () => updateStatus(id, item);
                    item.oncontextmenu = (e) => { e.preventDefault(); updateStatus(id, item, (counts[id] === 2 ? 0 : 2)); };
                    item.innerHTML = `<span class="piece-num">${num}</span><span class="status-badge">余り</span>`;
                    pieceList.appendChild(item);
                });
                rarDiv.appendChild(pieceList);
                setContent.appendChild(rarDiv);
            }
            setDiv.appendChild(setTitle);
            setDiv.appendChild(setContent);
            catContent.appendChild(setDiv);
        }
        catDiv.appendChild(catTitle);
        catDiv.appendChild(catContent);
        listEl.appendChild(catDiv);
    }
}

function updateStatus(id, el, nextVal) {
    if (typeof nextVal === 'undefined') nextVal = ((allData[currentChar].counts[id] || 0) + 1) % 3;
    allData[currentChar].counts[id] = nextVal;
    el.className = `piece-item ${nextVal >= 1 ? 'owned' : ''} ${nextVal === 2 ? 'extra' : ''}`;
    saveAll();
}

function saveAll() {
    localStorage.setItem('puzzle_v5_data', JSON.stringify(allData));
    localStorage.setItem('puzzle_last_char_v5', currentChar);
}

function generateOutput() {
    const counts = allData[currentChar].counts || {};
    let res = { offers: {}, wants: {} };
    for (const cat in puzzleData) {
        for (const set in puzzleData[cat]) {
            for (const sub in puzzleData[cat][set]) {
                puzzleData[cat][set][sub].forEach(num => {
                    const id = `${cat}_${set}_${sub}_${num}`;
                    const val = counts[id] || 0;
                    if (val === 2) appendRes(res.offers, cat, set, num);
                    if (val === 0 && sub !== "S5") appendRes(res.wants, cat, set, num);
                });
            }
        }
    }
    document.getElementById('output').value = `【${currentChar}のパズル】\n【持っているもの】\n${format(res.offers)}\n【欲しいもの】\n${format(res.wants)}`;
}

function appendRes(obj, cat, set, num) { if (!obj[cat]) obj[cat] = {}; if (!obj[cat][set]) obj[cat][set] = []; obj[cat][set].push(num); }
function format(data) { let s = ""; for (const cat in data) { s += `${cat}\n`; for (const set in data[cat]) s += ` - ${set} ${compress(data[cat][set])}\n`; } return s || "なし\n"; }
function compress(nums) { if (!nums.length) return ""; nums.sort((a, b) => a - b); let r = [], s = nums[0], e = nums[0]; for (let i = 1; i <= nums.length; i++) { if (i < nums.length && nums[i] === e + 1) e = nums[i]; else { r.push(s === e ? s : `${s}~${e}`); if (i < nums.length) s = e = nums[i]; } } return r.join(', '); }

function exportData() { document.getElementById('backup-text').value = JSON.stringify(allData); alert("コピーしました。"); }
function importData() {
    try {
        allData = JSON.parse(document.getElementById('backup-text').value);
        saveAll(); updateCharList(); init(); alert("復元完了！");
    } catch(e) { alert("エラー"); }
}

loadData();
</script>
</body>
</html>
