<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>ホワサバ パズル管理 (Dark)</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        :root {
            /* ダークモード用のカラー設定 */
            --primary: #3498db;
            --secondary: #1a1a1a; /* より深い黒 */
            --accent: #e74c3c;
            --bg: #121212;      /* 全体の背景 */
            --card-bg: #1e1e1e; /* カードの背景 */
            --text: #e0e0e0;    /* 文字色 */
            --border: #333333;  /* 枠線 */
            --rarity-bg: #252525;
        }

        body { font-family: 'Helvetica Neue', Arial, sans-serif; background: var(--bg); margin: 0; padding: 10px; color: var(--text); line-height: 1.6; }
        .container { max-width: 800px; margin: 0 auto; background: var(--card-bg); padding: 20px; border-radius: 16px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        
        h1 { font-size: 1.4rem; text-align: center; color: var(--primary); margin-bottom: 20px; }

        /* カテゴリ（折りたたみ） */
        .category { margin-bottom: 12px; border: 1px solid var(--border); border-radius: 10px; overflow: hidden; background: var(--card-bg); }
        .category-title { 
            background: var(--secondary); color: var(--primary); padding: 14px 20px; 
            cursor: pointer; font-weight: bold; display: flex; justify-content: space-between; align-items: center;
            border-bottom: 1px solid var(--border);
        }
        .category-title::after { content: '▼'; font-size: 0.8rem; transition: 0.3s; color: var(--text); }
        .category.active .category-title::after { transform: rotate(180deg); }
        .category-content { display: none; padding: 15px; background: var(--card-bg); }
        .category.active .category-content { display: block; }

        /* セット & ピース表示 */
        .set-container { margin-bottom: 25px; border-bottom: 1px solid var(--border); padding-bottom: 15px; }
        .set-title { font-weight: bold; color: var(--primary); margin-bottom: 12px; font-size: 1rem; border-left: 4px solid var(--primary); padding-left: 10px; }
        
        .rarity-group { margin-bottom: 15px; padding: 10px; background: var(--rarity-bg); border-radius: 8px; }
        .stars { color: #f1c40f; font-size: 0.8rem; margin-bottom: 8px; display: block; }
        
        .piece-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(70px, 1fr)); gap: 10px; }
        .piece-item { 
            display: flex; flex-direction: column; align-items: center; 
            padding: 8px; border: 1px solid var(--border); border-radius: 8px; 
            cursor: pointer; transition: 0.2s; position: relative; user-select: none;
            background: #2c2c2c;
        }
        /* 所持・余りの色もダークモードに最適化 */
        .piece-item.owned { background: #1a3a5a; border-color: var(--primary); color: #fff; }
        .piece-item.extra { background: #4a1a1a; border-color: var(--accent); color: #fff; }
        
        .piece-num { font-weight: bold; font-size: 0.9rem; }
        .status-badge { font-size: 0.6rem; padding: 2px 4px; border-radius: 4px; display: none; margin-top: 4px; }
        .extra .status-badge { display: block; background: var(--accent); color: white; }
        .s5-label { color: #e67e22; font-size: 0.6rem; margin-top: 2px; }

        /* 操作エリア */
        .controls, .backup-area { background: var(--secondary); padding: 15px; border-radius: 12px; margin-top: 20px; border: 1px solid var(--border); }
        textarea { 
            width: 100%; height: 100px; margin-top: 10px; font-family: monospace; 
            border: 1px solid var(--border); border-radius: 8px; padding: 10px; 
            box-sizing: border-box; resize: vertical; background: #222; color: #fff;
        }
        button { width: 100%; padding: 14px; background: var(--primary); color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; font-size: 1rem; margin-bottom: 8px; }
        button:hover { filter: brightness(1.1); }
        .btn-backup { background: #444; font-size: 0.85rem; padding: 10px; color: #bbb; }
    </style>
</head>
<body>

<div class="container">
    <h1>🧩 ホワサバ パズル管理</h1>
    
    <div id="puzzle-list">読み込み中...</div>

    <div class="controls">
        <button onclick="generateOutput()">共有用テキストを生成</button>
        <textarea id="output" readonly placeholder="ここに共有用テキストが出ます"></textarea>
    </div>

    <div class="backup-area">
        <p style="font-size: 0.8rem; font-weight: bold; color: #888; margin: 0 0 10px 0;">バックアップ / インポート</p>
        <div style="display: flex; gap: 8px;">
            <button class="btn-backup" onclick="exportData()">書き出し</button>
            <button class="btn-backup" style="background:#1e7e46; color: white;" onclick="importData()">読み込み</button>
        </div>
        <textarea id="backup-text" placeholder="バックアップデータをここに貼り付け"></textarea>
    </div>
</div>

<script>
let puzzleData = {};
let counts = JSON.parse(localStorage.getItem('puzzleCountsV3')) || {};

async function loadData() {
    try {
        const response = await fetch('data.json');
        if (!response.ok) throw new Error('JSON not found');
        puzzleData = await response.json();
        init();
    } catch (e) {
        document.getElementById('puzzle-list').innerText = "エラー: data.jsonの読み込みに失敗しました。";
    }
}

function init() {
    const listEl = document.getElementById('puzzle-list');
    listEl.innerHTML = "";
    const closedCategories = ["復活の炎", "英雄の歌", "世界探究"];

    for (const cat in puzzleData) {
        const catDiv = document.createElement('div');
        catDiv.className = 'category';
        if (!closedCategories.includes(cat)) catDiv.classList.add('active');

        const titleEl = document.createElement('div');
        titleEl.className = 'category-title';
        titleEl.innerText = cat;
        titleEl.onclick = () => catDiv.classList.toggle('active');
        
        const contentDiv = document.createElement('div');
        contentDiv.className = 'category-content';

        for (const set in puzzleData[cat]) {
            const setDiv = document.createElement('div');
            setDiv.className = 'set-container';
            setDiv.innerHTML = `<div class="set-title">${set}</div>`;

            for (const sub in puzzleData[cat][set]) {
                const rarDiv = document.createElement('div');
                rarDiv.className = 'rarity-group';
                const starStr = isNaN(sub.replace('S','')) ? sub : '⭐'.repeat(parseInt(sub.replace('S','')));
                rarDiv.innerHTML = `<span class="stars">${starStr}</span>`;
                const pieceList = document.createElement('div');
                pieceList.className = 'piece-list';

                puzzleData[cat][set][sub].forEach(num => {
                    const id = `${cat}_${set}_${sub}_${num}`;
                    const val = counts[id] || 0;
                    const item = document.createElement('div');
                    item.className = `piece-item ${val >= 1 ? 'owned' : ''} ${val === 2 ? 'extra' : ''}`;
                    item.onclick = () => updateStatus(id, item);
                    item.oncontextmenu = (e) => { e.preventDefault(); updateStatus(id, item, (counts[id] === 2 ? 0 : 2)); };
                    item.innerHTML = `<span class="piece-num">${num}</span><span class="status-badge">余り</span>${sub === 'S5' ? '<span class="s5-label">リク不可</span>' : ''}`;
                    pieceList.appendChild(item);
                });
                rarDiv.appendChild(pieceList);
                setDiv.appendChild(rarDiv);
            }
            contentDiv.appendChild(setDiv);
        }
        catDiv.appendChild(titleEl);
        catDiv.appendChild(contentDiv);
        listEl.appendChild(catDiv);
    }
}

function updateStatus(id, el, nextVal) {
    if (typeof nextVal === 'undefined') nextVal = ((counts[id] || 0) + 1) % 3;
    counts[id] = nextVal;
    el.className = `piece-item ${nextVal >= 1 ? 'owned' : ''} ${nextVal === 2 ? 'extra' : ''}`;
    localStorage.setItem('puzzleCountsV3', JSON.stringify(counts));
}

function generateOutput() {
    let res = { offers: {}, wants: {} };
    for (const cat in puzzleData) {
        for (const set in puzzleData[cat]) {
            for (const sub in puzzleData[cat][set]) {
                puzzleData[cat][set][sub].forEach(num => {
                    const val = counts[`${cat}_${set}_${sub}_${num}`] || 0;
                    if (val === 2) appendRes(res.offers, cat, set, num);
                    if (val === 0 && sub !== "S5") appendRes(res.wants, cat, set, num);
                });
            }
        }
    }
    document.getElementById('output').value = `【持っているもの】\n${format(res.offers)}\n【欲しいもの】\n${format(res.wants)}`;
}

function appendRes(obj, cat, set, num) { if (!obj[cat]) obj[cat] = {}; if (!obj[cat][set]) obj[cat][set] = []; obj[cat][set].push(num); }
function format(data) { let s = ""; for (const cat in data) { s += `${cat}\n`; for (const set in data[cat]) s += ` - ${set} ${compress(data[cat][set])}\n`; } return s || "なし\n"; }
function compress(nums) { if (!nums.length) return ""; nums.sort((a, b) => a - b); let r = [], s = nums[0], e = nums[0]; for (let i = 1; i <= nums.length; i++) { if (i < nums.length && nums[i] === e + 1) e = nums[i]; else { r.push(s === e ? s : `${s}~${e}`); if (i < nums.length) s = e = nums[i]; } } return r.join(', '); }
function exportData() { document.getElementById('backup-text').value = JSON.stringify(counts); alert("データを書き出しました。"); }
function importData() { try { counts = JSON.parse(document.getElementById('backup-text').value); localStorage.setItem('puzzleCountsV3', JSON.stringify(counts)); init(); alert("読み込み完了！"); } catch(e) { alert("形式が正しくありません。"); } }

loadData();
</script>
</body>
</html>
