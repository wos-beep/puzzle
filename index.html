<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>ホワサバ パズル v10.9</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        :root { --primary: #3498db; --bg: #121212; --card-bg: #1e1e1e; --text: #e0e0e0; --border: #333; }
        body { font-family: sans-serif; background: var(--bg); margin: 0; padding: 10px; color: var(--text); }
        .container { max-width: 800px; margin: 0 auto; background: var(--card-bg); padding: 15px; border-radius: 12px; }
        .char-selector { background: #252525; padding: 10px; border-radius: 8px; margin-bottom: 15px; display: flex; gap: 5px; }
        select { background: #333; color: #fff; border: 1px solid var(--border); padding: 5px; flex-grow: 1; }
        .category { margin-bottom: 8px; border: 1px solid var(--border); border-radius: 8px; }
        .category-title { background: #1a1a1a; color: var(--primary); padding: 10px; cursor: pointer; font-weight: bold; display: flex; align-items: center; justify-content: space-between; }
        .cat-copy-btn { background: #27ae60; color: #fff; border: none; border-radius: 4px; padding: 4px 8px; font-size: 0.75rem; cursor: pointer; }
        .category-content { display: none; padding: 10px; }
        .category.active .category-content { display: block; }
        .set-container { margin-bottom: 5px; border: 1px solid #333; border-radius: 5px; }
        .set-header { background: #252525; display: flex; padding: 5px; font-size: 0.85rem; }
        .piece-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(45px, 1fr)); gap: 4px; padding: 5px; }
        .piece-item { text-align: center; padding: 4px; border: 1px solid var(--border); border-radius: 4px; font-size: 0.8rem; cursor: pointer; }
        .want { background: #5d4017; color: #f39c12; }
        .extra { background: #4a1a1a; color: #ff7675; }
        .owned { background: #1a3a5a; color: #3498db; }
        .output-area { background: #1a1a1a; padding: 10px; border-radius: 8px; margin-top: 15px; }
        textarea { width: 100%; height: 120px; background: #000; color: #0f0; border: 1px solid var(--border); font-size: 0.75rem; margin-top: 5px; }
        #copy-status { font-size: 0.75rem; color: #2ecc71; text-align: center; height: 1.2em; }
    </style>
</head>
<body>
<div class="container">
    <div class="char-selector">
        <select id="char-select" onchange="switchChar()"></select>
        <button onclick="addChar()">+</button>
    </div>
    <div id="puzzle-list"></div>
    <div class="output-area">
        <button style="width:100%; padding:10px;" onclick="generateOutput()">全件コピー</button>
        <div id="copy-status"></div>
        <textarea id="output" readonly></textarea>
    </div>
</div>

<script>
let puzzleData = {}; let currentChar = "";
const STORAGE_KEY = 'puzzle_v10_data';
let allData = JSON.parse(localStorage.getItem(STORAGE_KEY)) || { "メイン": { counts: {}, closedCats: {}, closedSets: {} } };

async function loadData() {
    try {
        const res = await fetch('data.json');
        puzzleData = await res.json();
        currentChar = localStorage.getItem('puzzle_last_char_v10') || Object.keys(allData)[0];
        updateCharList(); init();
    } catch (e) { alert("data.json error"); }
}

function updateCharList() {
    const s = document.getElementById('char-select'); s.innerHTML = "";
    Object.keys(allData).forEach(n => { s.add(new Option(n, n)); if(n===currentChar) s.value=n; });
}

function addChar() { const n = prompt("名:"); if(n) { allData[n]={counts:{},closedCats:{},closedSets:{}}; currentChar=n; save(); updateCharList(); init(); } }
function switchChar() { currentChar = document.getElementById('char-select').value; save(); init(); }
function save() { localStorage.setItem(STORAGE_KEY, JSON.stringify(allData)); localStorage.setItem('puzzle_last_char_v10', currentChar); }

function init() {
    const list = document.getElementById('puzzle-list'); list.innerHTML = "";
    const counts = allData[currentChar].counts;
    for (const cat in puzzleData) {
        const catDiv = document.createElement('div'); catDiv.className = 'category active';
        const title = document.createElement('div'); title.className = 'category-title';
        title.innerHTML = `<span>${cat}</span><button class="cat-copy-btn" onclick="generateOutput('${cat}')">📋${cat}のみ</button>`;
        title.onclick = (e) => { if(e.target.tagName!=='BUTTON') catDiv.classList.toggle('active'); };
        const content = document.createElement('div'); content.className = 'category-content';
        for (const set in puzzleData[cat]) {
            const setDiv = document.createElement('div'); setDiv.className = 'set-container';
            setDiv.innerHTML = `<div class="set-header">${set}</div>`;
            const pieceList = document.createElement('div'); pieceList.className = 'piece-list';
            for (const sub in puzzleData[cat][set]) {
                puzzleData[cat][set][sub].forEach(num => {
                    const id = `${cat}_${set}_${sub}_${num}`; const v = counts[id]||0;
                    const it = document.createElement('div'); it.className = `piece-item ${v===1?'want':v===2?'extra':v===3?'owned':''}`;
                    it.innerText = num;
                    it.onclick = () => { const nv = (counts[id]||0+1)%4; counts[id]=nv; init(); save(); };
                    pieceList.appendChild(it);
                });
            }
            setDiv.appendChild(pieceList); content.appendChild(setDiv);
        }
        catDiv.append(title, content); list.appendChild(catDiv);
    }
}

function generateOutput(target) {
    const counts = allData[currentChar].counts;
    let o = [], w = [];
    for (const c in puzzleData) {
        if (target && c !== target) continue;
        for (const s in puzzleData[c]) {
            let lo = [], lw = [];
            for (const sub in puzzleData[c][s]) {
                puzzleData[c][s][sub].forEach(n => {
                    const v = counts[`${c}_${s}_${sub}_${n}`];
                    if(v===2) lo.push(n); if(v===1 && sub!=="S5") lw.push(n);
                });
            }
            if(lo.length) o.push(`${s}(${compress(lo)})`);
            if(lw.length) w.push(`${s}(${compress(lw)})`);
        }
    }
    // 極限まで短縮したフォーマット
    let txt = `【${currentChar}${target?'/'+target:''}】\n`;
    txt += `譲| ${o.join(' / ')}\n`;
    txt += `求| ${w.join(' / ')}`;

    const out = document.getElementById('output'); out.value = txt;
    navigator.clipboard.writeText(txt).then(() => {
        document.getElementById('copy-status').innerText = "📋コピー完了";
        setTimeout(() => document.getElementById('copy-status').innerText="", 2000);
    });
}

function compress(n) { if(!n.length) return ""; n.sort((a,b)=>a-b); let r=[], s=n[0], e=n[0]; for(let i=1;i<=n.length;i++){ if(i<n.length&&n[i]===e+1) e=n[i]; else { r.push(s===e?s:`${s}-${e}`); if(i<n.length) s=e=n[i]; } } return r.join(','); }
loadData();
</script>
</body>
</html>
