<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>ホワサバ パズル管理 v10.17</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        :root { --primary: #3498db; --secondary: #1a1a1a; --accent: #e74c3c; --want: #f39c12; --bg: #121212; --card-bg: #1e1e1e; --text: #e0e0e0; --border: #333333; --rarity-bg: #252525; }
        body { font-family: sans-serif; background: var(--bg); margin: 0; padding: 10px; color: var(--text); line-height: 1.5; }
        .container { max-width: 800px; margin: 0 auto; background: var(--card-bg); padding: 15px; border-radius: 16px; }
        .version-tag { font-size: 0.7rem; color: #666; vertical-align: middle; margin-left: 8px; }
        .char-selector { background: #252525; padding: 10px; border-radius: 10px; margin-bottom: 15px; display: flex; gap: 8px; align-items: center; border: 1px solid var(--border); }
        select { background: #333; color: #fff; border: 1px solid var(--border); padding: 8px; border-radius: 5px; flex-grow: 1; outline: none; }
        .char-btn { padding: 8px 12px; font-size: 0.75rem; cursor: pointer; border-radius: 5px; border: none; font-weight: bold; }
        h1 { font-size: 1.1rem; text-align: center; color: var(--primary); margin: 5px 0 15px; }
        .category { margin-bottom: 10px; border: 1px solid var(--border); border-radius: 10px; overflow: hidden; }
        .category-title { background: var(--secondary); color: var(--primary); padding: 12px 15px; cursor: pointer; font-weight: bold; display: flex; align-items: center; gap: 8px; position: relative; }
        .cat-copy-btn { background: #444; color: #fff; border: none; border-radius: 4px; padding: 4px 8px; font-size: 0.7rem; cursor: pointer; }
        .category-title::after { content: '▼'; font-size: 0.8rem; transition: 0.3s; color: var(--text); margin-left: auto; }
        .category.active .category-title::after { transform: rotate(180deg); }
        .category-content { display: none; padding: 10px; }
        .category.active .category-content { display: block; }
        .set-container { margin-bottom: 8px; border: 1px solid #333; border-radius: 8px; overflow: hidden; }
        .set-header { background: #252525; display: flex; align-items: center; padding-right: 8px; border-left: 4px solid var(--primary); }
        .set-title-area { flex-grow: 1; padding: 8px; cursor: pointer; display: flex; align-items: center; gap: 8px; }
        .set-name { font-weight: bold; font-size: 0.9rem; }
        .bulk-btns { display: flex; gap: 4px; }
        .bulk-btn { font-size: 0.65rem; padding: 4px 6px; border-radius: 4px; border: none; cursor: pointer; font-weight: bold; color: white; }
        .set-content { display: none; padding: 8px; background: #1e1e1e; }
        .set-container.active .set-content { display: block; }
        .rarity-group { margin-bottom: 8px; padding: 6px; background: var(--rarity-bg); border-radius: 6px; }
        .stars { color: #f1c40f; font-size: 0.7rem; margin-bottom: 4px; display: block; }
        .piece-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(50px, 1fr)); gap: 6px; }
        .piece-item { display: flex; flex-direction: column; align-items: center; padding: 6px; border: 1px solid var(--border); border-radius: 6px; cursor: pointer; background: #2c2c2c; }
        .piece-item.want { background: #5d4017; border-color: var(--want); }
        .piece-item.extra { background: #4a1a1a; border-color: var(--accent); }
        .piece-item.owned { background: #1a3a5a; border-color: var(--primary); }
        .piece-num { font-size: 0.8rem; font-weight: bold; }
        .output-area, .backup-area { background: var(--secondary); padding: 15px; border-radius: 12px; margin-top: 15px; border: 1px solid var(--border); }
        textarea { width: 100%; height: 100px; margin-top: 8px; background: #222; color: #fff; border: 1px solid var(--border); border-radius: 8px; padding: 10px; font-size: 0.75rem; resize: none; box-sizing: border-box; }
        button.main-btn { width: 100%; padding: 12px; background: var(--primary); color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; }
        button.sub-btn { background: #555; color: white; border: none; border-radius: 5px; padding: 8px; cursor: pointer; font-size: 0.75rem; margin-right: 5px; }
        #copy-status { font-size: 0.75rem; color: #2ecc71; text-align: center; height: 1.2em; margin-top: 5px; }
        .status-summary { display: flex; gap: 4px; }
        .count-badge { font-size: 0.65rem; padding: 1px 4px; border-radius: 4px; font-weight: bold; border: 1px solid rgba(255,255,255,0.1); }
        .badge-want { background: #5d4017; color: var(--want); border-color: var(--want); }
        .badge-extra { background: #4a1a1a; color: #ff7675; border-color: var(--accent); }
        .badge-s5 { background: #444; color: #bbb; border-color: #666; }
    </style>
</head>
<body>
<div class="container">
    <div class="char-selector">
        <select id="char-select" onchange="switchChar()"></select>
        <button class="char-btn" style="background: #27ae60; color: white;" onclick="addChar()">追加</button>
        <button class="char-btn" style="background: #c0392b; color: white;" onclick="deleteChar()">削除</button>
    </div>
    <h1>🧩 ホワサバ パズル管理<span class="version-tag">v10.17</span></h1>
    <div id="puzzle-list"></div>
    <div class="output-area">
        <button class="main-btn" onclick="generateOutput()">全生成 & 極小コピー</button>
        <div id="copy-status"></div>
        <textarea id="output" readonly></textarea>
    </div>
    <div class="backup-area">
        <div style="font-size:0.8rem; margin-bottom:10px; font-weight:bold; color:#aaa;">⚙️ 高圧縮バックアップ</div>
        <button class="sub-btn" onclick="exportData()">圧縮出力</button>
        <button class="sub-btn" onclick="importData()">復元入力を実行</button>
        <textarea id="io-area" placeholder="圧縮コードを貼り付け"></textarea>
    </div>
</div>

<script>
let puzzleData = {};
let currentChar = "";
const STORAGE_KEY = 'puzzle_v10_data';
const CHAR_KEY = 'puzzle_last_char_v10';

let allData = JSON.parse(localStorage.getItem(STORAGE_KEY)) || { "メイン": { counts: {}, closedCats: {}, closedSets: {} } };
function getSafeId(str) { return btoa(unescape(encodeURIComponent(str))).replace(/[^a-zA-Z0-9]/g, ""); }

async function loadData() {
    try {
        const response = await fetch('https://wos-beep.github.io/puzzle/data.json');
        puzzleData = await response.json();
        currentChar = localStorage.getItem(CHAR_KEY) || Object.keys(allData)[0];
        updateCharList(); init(); saveAll();
    } catch (e) { document.getElementById('puzzle-list').innerText = "データ読み込みエラー"; }
}

// 【略称ルール修正】5-6文字までは短縮せず維持する
function shorten(name) {
    return name.replace('トロフィーと栄誉', '栄誉')
               .replace('バーニングサンキャノン', '大砲')
               .replace('帝国滅亡の鐘', '鐘')
               .replace('競技場プレイヤー', '競技場')
               .replace('アイアンフラッド', 'フラッド')
               .replace('カリスト戦車', 'カリスト')
               .replace('グループ対決', 'グループ')
               .replace('エリート対決', 'エリート')
               .replace('文明の夜明け', '文明')
               .replace('黎明の光', '黎明')
               .replace('第一段階', '(1)')
               .replace('第二段階', '(2)')
               .replace('第三段階', '(3)');
    // 兵器の王、頂上決戦などはそのまま
}

// 基本機能
function updateCharList() { const select = document.getElementById('char-select'); select.innerHTML = ""; Object.keys(allData).forEach(name => { const opt = new Option(name, name); if(name === currentChar) opt.selected = true; select.add(opt); }); }
function addChar() { const name = prompt("名:"); if (name && !allData[name]) { allData[name] = { counts: {}, closedCats: {}, closedSets: {} }; currentChar = name; saveAll(); updateCharList(); init(); } }
function deleteChar() { if (Object.keys(allData).length <= 1) return; if (confirm(`削除しますか？`)) { delete allData[currentChar]; currentChar = Object.keys(allData)[0]; saveAll(); updateCharList(); init(); } }
function switchChar() { currentChar = document.getElementById('char-select').value; saveAll(); init(); }

function init() {
    const listEl = document.getElementById('puzzle-list'); listEl.innerHTML = "";
    const counts = allData[currentChar].counts || {};
    for (const cat in puzzleData) {
        const catDiv = document.createElement('div'); catDiv.className = 'category' + (allData[currentChar].closedCats[cat] ? '' : ' active');
        const catTitle = document.createElement('div'); catTitle.className = 'category-title';
        catTitle.onclick = (e) => { if(e.target.tagName==='BUTTON') return; const a = catDiv.classList.toggle('active'); allData[currentChar].closedCats[cat] = !a; saveAll(); };
        catTitle.innerHTML = `<span>${cat}</span><button class="cat-copy-btn" onclick="generateOutput('${cat}')">📋</button><div id="cat_counter_${getSafeId(cat)}" class="status-summary"></div>`;
        const catContent = document.createElement('div'); catContent.className = 'category-content';
        for (const set in puzzleData[cat]) {
            const setKey = `${cat}_${set}`; const setDiv = document.createElement('div'); setDiv.className = 'set-container' + (allData[currentChar].closedSets[setKey] ? '' : ' active');
            const setHeader = document.createElement('div'); setHeader.className = 'set-header';
            const titleArea = document.createElement('div'); titleArea.className = 'set-title-area';
            titleArea.onclick = () => { const a = setDiv.classList.toggle('active'); allData[currentChar].closedSets[setKey] = !a; saveAll(); };
            titleArea.innerHTML = `<span class="set-name">${set}</span><div id="counter_${getSafeId(cat+set)}" class="status-summary"></div>`;
            const btnArea = document.createElement('div'); btnArea.className = 'bulk-btns';
            btnArea.innerHTML = `<button class="bulk-btn" style="background:#3498db;" onclick="bulkUpdate('${cat}','${set}',3)">済</button><button class="bulk-btn" style="background:#f39c12;" onclick="bulkUpdate('${cat}','${set}',1)">求</button><button class="bulk-btn" style="background:#555;" onclick="bulkUpdate('${cat}','${set}',0)">×</button>`;
            const setContent = document.createElement('div'); setContent.className = 'set-content';
            for (const sub in puzzleData[cat][set]) {
                const rarDiv = document.createElement('div'); rarDiv.className = 'rarity-group';
                rarDiv.innerHTML = `<span class="stars">${sub.replace('S','⭐')}</span>`;
                const pieceList = document.createElement('div'); pieceList.className = 'piece-list';
                puzzleData[cat][set][sub].forEach(num => {
                    const id = `${cat}_${set}_${sub}_${num}`; const val = counts[id] || 0;
                    const item = document.createElement('div'); item.id = `item_${id}`;
                    item.className = `piece-item ${val===1?'want':''} ${val===2?'extra':''} ${val===3?'owned':''}`;
                    item.onclick = () => updateStatus(cat, set, sub, num, item);
                    item.innerHTML = `<span class="piece-num">${num}</span>`;
                    pieceList.appendChild(item);
                });
                rarDiv.appendChild(pieceList); setContent.appendChild(rarDiv);
            }
            setHeader.append(titleArea, btnArea); setDiv.append(setHeader, setContent); catContent.appendChild(setDiv);
        }
        catDiv.append(catTitle, catContent); listEl.appendChild(catDiv);
    }
    updateAllCounters();
}

function updateAllCounters() {
    for (const cat in puzzleData) {
        let catWant = 0, catS5 = 0, catExtra = 0;
        for (const set in puzzleData[cat]) { const res = updateCounter(cat, set); catWant += res.want; catS5 += res.s5; catExtra += res.extra; }
        const el = document.getElementById(`cat_counter_${getSafeId(cat)}`);
        if (el) { el.innerHTML = (catWant?`<span class="count-badge badge-want">求:${catWant}</span>`:'')+(catS5?`<span class="count-badge badge-s5">S5:${catS5}</span>`:'')+(catExtra?`<span class="count-badge badge-extra">譲:${catExtra}</span>`:''); }
    }
}
function updateCounter(cat, set) {
    const counts = allData[currentChar].counts; let want = 0, s5 = 0, extra = 0;
    for (const sub in puzzleData[cat][set]) {
        puzzleData[cat][set][sub].forEach(num => {
            const v = counts[`${cat}_${set}_${sub}_${num}`] || 0;
            if (v === 1) { if (sub === "S5") s5++; else want++; } if (v === 2) extra++;
        });
    }
    const el = document.getElementById(`counter_${getSafeId(cat+set)}`);
    if (el) { el.innerHTML = (want?`<span class="count-badge badge-want">求:${want}</span>`:'')+(s5?`<span class="count-badge badge-s5">S5:${s5}</span>`:'')+(extra?`<span class="count-badge badge-extra">譲:${extra}</span>`:''); }
    return { want, s5, extra };
}
function bulkUpdate(cat, set, val) {
    for (const sub in puzzleData[cat][set]) {
        puzzleData[cat][set][sub].forEach(num => { const id = `${cat}_${set}_${sub}_${num}`; allData[currentChar].counts[id] = val; const item = document.getElementById(`item_${id}`); if(item) item.className = `piece-item ${val===1?'want':''} ${val===2?'extra':''} ${val===3?'owned':''}`; });
    }
    updateAllCounters(); saveAll();
}
function updateStatus(cat, set, sub, num, el) {
    const id = `${cat}_${set}_${sub}_${num}`; const nextVal = ((allData[currentChar].counts[id] || 0) + 1) % 4;
    allData[currentChar].counts[id] = nextVal; el.className = `piece-item ${nextVal===1?'want':''} ${nextVal===2?'extra':''} ${nextVal===3?'owned':''}`; updateAllCounters(); saveAll();
}
function saveAll() { localStorage.setItem(STORAGE_KEY, JSON.stringify(allData)); localStorage.setItem(CHAR_KEY, currentChar); }

function generateOutput(targetCat) {
    const counts = allData[currentChar].counts || {};
    let outputLines = [];
    outputLines.push(`【${currentChar}】`);
    for (const cat in puzzleData) {
        if (targetCat && cat !== targetCat) continue;
        let o = [], w = [];
        for (const set in puzzleData[cat]) {
            let lo = [], lw = [];
            for (const sub in puzzleData[cat][set]) {
                puzzleData[cat][set][sub].forEach(num => {
                    const v = counts[`${cat}_${set}_${sub}_${num}`] || 0;
                    if (v === 2) lo.push(num); if (v === 1 && sub !== "S5") lw.push(num);
                });
            }
            if (lo.length) o.push(`${shorten(set)}(${compress(lo)})`);
            if (lw.length) w.push(`${shorten(set)}(${compress(lw)})`);
        }
        if (o.length > 0 || w.length > 0) {
            outputLines.push(`《${shorten(cat)}》`);
            if (o.length) outputLines.push(`譲:${o.join('/')}`);
            if (w.length) outputLines.push(`求:${w.join('/')}`);
        }
    }
    const txt = outputLines.join('\n');
    document.getElementById('output').value = txt;
    navigator.clipboard.writeText(txt).then(() => { const s = document.getElementById('copy-status'); s.innerText = "📋 短縮コピー完了！"; setTimeout(() => s.innerText = "", 2000); });
}
function compress(n) { if(!n.length) return ""; n.sort((a,b)=>a-b); let r=[], s=n[0], e=n[0]; for(let i=1;i<=n.length;i++){ if(i<n.length&&n[i]===e+1) e=n[i]; else { r.push(s===e?s:`${s}-${e}`); if(i<n.length) s=e=n[i]; } } return r.join(','); }

// 高圧縮エクスポート
function exportData() {
    let exportObj = { v: "10.16", d: {} };
    for (let char in allData) {
        let bitString = "";
        for (let cat in puzzleData) {
            for (let set in puzzleData[cat]) {
                for (let sub in puzzleData[cat][set]) {
                    puzzleData[cat][set][sub].forEach(num => {
                        bitString += (allData[char].counts[`${cat}_${set}_${sub}_${num}`] || 0);
                    });
                }
            }
        }
        exportObj.d[char] = bitString;
    }
    const area = document.getElementById('io-area');
    area.value = JSON.stringify(exportObj);
    area.select(); document.execCommand('copy');
    alert("コピーしました。");
}

function importData() {
    const area = document.getElementById('io-area');
    if(!area.value) return;
    try {
        const importObj = JSON.parse(area.value);
        if (importObj.v !== "10.16") {
            if (confirm("旧形式のデータです。上書きしますか？")) { allData = importObj; saveAll(); location.reload(); }
            return;
        }
        if(confirm("データを復元しますか？")) {
            let newData = {};
            for (let char in importObj.d) {
                newData[char] = { counts: {}, closedCats: {}, closedSets: {} };
                let bitArray = importObj.d[char].split("");
                let idx = 0;
                for (let cat in puzzleData) {
                    for (let set in puzzleData[cat]) {
                        for (let sub in puzzleData[cat][set]) {
                            puzzleData[cat][set][sub].forEach(num => {
                                let val = parseInt(bitArray[idx++] || 0);
                                if (val > 0) newData[char].counts[`${cat}_${set}_${sub}_${num}`] = val;
                            });
                        }
                    }
                }
            }
            allData = newData; saveAll(); updateCharList(); init(); alert("復元完了");
        }
    } catch(e) { alert("形式エラー"); }
}

loadData();
</script>
</body>
</html>
